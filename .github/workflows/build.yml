name: Build Darck APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create Flutter project files
        run: |
          flutter create --platforms=android --project-name darck.
          rm -f lib/main.dart
          mv pubspec.yaml pubspec.yaml.bak || true
          cat > pubspec.yaml << 'EOF'
          name: darck
          description: Darck Universal App
          publish_to: 'none'
          version: 4.8.1+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^2.24.0
            firebase_auth: ^4.15.0
            cloud_firestore: ^4.15.0
            google_sign_in: ^6.2.1
            shared_preferences: ^2.2.2
          flutter:
            uses-material-design: true
          EOF
      - name: Restore main.dart
        run: |
          ls -la lib/
          cat lib/main.dart | head -20
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: darck-apk
          path: build/app/outputs/flutter-apk/app-release.apk
